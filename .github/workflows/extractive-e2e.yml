name: Extractive E2E (weekly)

# Fährt die reale extractive-Pipeline über Subprozesse (tests/extractive/test_e2e.py):
# lädt das GLiNER-Modell urchade/gliner_medium-v2.1 (~500 MB) von HuggingFace. Zu
# schwer für jede PR — daher wöchentlich + manuell (workflow_dispatch). Der
# modellfreie Teil läuft in ci.yml (Job extractive-unit).
on:
  schedule:
    - cron: "0 5 * * 1" # montags 05:00 UTC
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      # Explizit auf den gecachten Pfad gepinnt (huggingface_hub expandiert die
      # Tilde selbst). Entspricht dem Default auf ubuntu-Runnern, macht Download-
      # Ziel und Cache-Pfad aber auch bei kuenftig gesetztem XDG_CACHE_HOME identisch.
      HF_HOME: ~/.cache/huggingface
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # HuggingFace-Cache: GLiNER-Modell (~500 MB) nur beim ersten Lauf bzw. bei
      # Modellwechsel ziehen. Key an gliner_planner.py gebunden (enthält
      # _MODEL_NAME = "urchade/gliner_medium-v2.1") → Cache invalidiert automatisch,
      # sobald sich der Modellname im Code ändert.
      - name: HuggingFace-Modell-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gliner_medium-v2.1-${{ hashFiles('extractive/pipeline/gliner_planner.py') }}
          restore-keys: |
            hf-gliner_medium-v2.1-

      # nltk punkt/punkt_tab (~64 MB entpackt) cachen — ändert sich praktisch nie.
      - name: nltk-Daten-Cache
        uses: actions/cache@v4
        with:
          path: ~/nltk_data
          key: nltk-punkt-v1

      # Retry-Schleife analog ci.yml. --extra dev = pytest, --extra extractive = NLP-Stack.
      - name: Abhängigkeiten installieren (uv, extractive + dev)
        shell: bash
        run: |
          for i in 1 2 3; do
            uv sync --extra extractive --extra dev --locked --python 3.12 && exit 0
            echo "uv sync Versuch $i fehlgeschlagen — warte $((i * 30))s"
            sleep $((i * 30))
          done
          uv sync --extra extractive --extra dev --locked --python 3.12

      - name: nltk-Satztokenizer laden (punkt)
        run: uv run python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab')"

      # Gesamte extractive-Suite inkl. E2E (test_e2e.py fährt die echte Pipeline).
      # Leer-Grün-Guard: Der Erstlauf 2026-07 war "28 passed, 6 skipped" — das
      # skipif in test_e2e.py griff, weil das damalige Fixture untracked war.
      # Skips bedeuten hier immer "Pipeline lief nicht wirklich" (fehlendes
      # Fixture oder leerer Pipeline-Output) → hart fehlschlagen statt gruen.
      - name: Extractive-Tests inkl. E2E (echtes GLiNER-Modell)
        shell: bash
        run: |
          set -o pipefail
          uv run python -m pytest tests/extractive -q -rs 2>&1 | tee pytest-out.txt
          if grep -qE "[0-9]+ skipped" pytest-out.txt; then
            echo "::error::Leer-Gruen-Guard: Es wurden Tests geskippt (Summary oben) — der Weekly-E2E-Lauf muss alle Tests wirklich fahren."
            exit 1
          fi
